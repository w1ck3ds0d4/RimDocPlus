name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The analysis layer is pure TypeScript with no shell of its own, so it checks out
  # anywhere. Ubuntu because it is the cheapest runner that can answer the question.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-checks and builds the frontend. Runs without dev fixtures present,
      # which is what a fresh clone looks like.
      - name: Type-check and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Formatting
        run: pnpm format:check

  # Windows, because the shell is where every Windows-specific assumption lives: the
  # registry reads that locate Steam, the process checks, the path handling, and the
  # CREATE_NO_WINDOW spawn flags. A green Ubuntu build says nothing about any of it,
  # and this is the half of the codebase that writes to a player's install.
  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The shell bundles the patch probe as a sidecar, so Tauri's build script needs the
      # binary present. It is built rather than committed: 13 MB does not belong in a git
      # history. Built here through the same pnpm scripts a contributor runs, so a change
      # that breaks them fails the build rather than being found by hand later.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build, so a probe that reports the wrong thing fails the run rather than
      # shipping. The case it exists for: a target a type inherits is not a missing one, and
      # reading declared methods only said it was.
      - name: Test the patch probe
        run: pnpm probe:test

      - name: Build the patch probe
        run: pnpm probe:build

      - name: Stage it as a sidecar
        run: pnpm probe:stage

      # The companion mod is bundled as a resource, so it has to exist before Tauri's build
      # script runs. Built from NuGet reference assemblies, which is the whole reason for
      # using them: no RimWorld install is needed to compile a RimWorld mod.
      - name: Build the companion mod
        run: pnpm probe-mod:build

      - name: Stage the companion mod
        run: pnpm probe-mod:stage

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Denied rather than warned: the lint list is clean today, and the only way it
      # stays clean is if letting it slip fails the build.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
