[package]
name = "rimdocplus"
version = "0.1.0"
description = "Diagnose, repair and supervise a modded RimWorld install"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rimdocplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3.2.1", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
